# SPDX-License-Identifier: GPL-3.0-or-later
name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This works without accounts, servers or data leaving the device
          required: true
